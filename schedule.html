<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coursera CHI - Schedule</title>
</head>
<body style="background-color: #111827; margin: 0; color: white; font-family: sans-serif;">

    <!-- Top Navigation Bar / Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; background-color: #324725; padding: 12px 24px;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <a href="Option.html" style="color: #9ca3af; text-decoration: none; font-size: 20px;">&larr; Back</a>
            <h1 style="margin: 0; font-size: 24px;">My Schedule</h1>
        </div>
        <a href="profile.html" title="View Profile and Grades">
            <img src="Images/Gemenai 2.jpg" alt="Profile Icon" width="50" style="border-radius: 50%; display: block; cursor: pointer;">
        </a>
    </header>

    <!-- Main Schedule Container -->
    <main style="max-width: 1000px; margin: 0 auto; padding: 24px;">

        <!-- Summary & Stats Bar -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; border-bottom: 1px solid #374151; padding-bottom: 16px;">
            <div>
                <h2 style="margin: 0 0 4px 0; font-size: 20px; color: #f9fafb;">Weekly Lecture Schedule</h2>
                <p style="margin: 0; font-size: 14px; color: #9ca3af;">Timetable for all enrolled courses</p>
            </div>
            <div style="display: flex; gap: 16px;">
                <span id="courseCountBadge" style="background-color: #1f2937; border: 1px solid #374151; padding: 6px 14px; border-radius: 6px; font-size: 13px; color: #60a5fa;">
                    0 Enrolled Courses
                </span>
                <span id="creditCountBadge" style="background-color: #1f2937; border: 1px solid #374151; padding: 6px 14px; border-radius: 6px; font-size: 13px; color: #a7f3d0;">
                    0 Credit Hours
                </span>
            </div>
        </div>

        <!-- Schedule Days Container -->
        <div id="scheduleContainer" style="display: flex; flex-direction: column; gap: 24px;">
            <!-- Rendered via JavaScript -->
        </div>

    </main>

    <script>
        // Default enrolled courses (includes Course Name, Code, Start Time, and Location)
        const defaultScheduleData = [
            {
                CourseCode: "CS201",
                CourseName: "Data Structures & Algorithms",
                CreditHours: 3,
                Day: "Sunday",
                StartTime: "09:00 AM",
                EndTime: "10:30 AM",
                Location: "Lec 212"
            },
            {
                CourseCode: "MATH201",
                CourseName: "Linear Algebra",
                CreditHours: 3,
                Day: "Sunday",
                StartTime: "11:00 AM",
                EndTime: "12:30 PM",
                Location: "Lec 111"
            },
            {
                CourseCode: "CS304",
                CourseName: "Database Systems",
                CreditHours: 4,
                Day: "Tuesday",
                StartTime: "10:00 AM",
                EndTime: "11:30 AM",
                Location: "Lec 211"
            },
            {
                CourseCode: "CS205",
                CourseName: "Computer Architecture",
                CreditHours: 3,
                Day: "Thursday",
                StartTime: "01:00 PM",
                EndTime: "02:30 PM",
                Location: "Lec 312"
            }
        ];

        // Retrieve registered courses from localStorage or fallback to defaults
        function loadEnrolledSchedule() {
            const savedCourses = localStorage.getItem("registeredCourses");
            if (savedCourses) {
                try {
                    return JSON.parse(savedCourses);
                } catch (e) {
                    return defaultScheduleData;
                }
            }
            return defaultScheduleData;
        }

        function renderSchedule() {
            const schedule = loadEnrolledSchedule();
            const container = document.getElementById("scheduleContainer");
            const courseBadge = document.getElementById("courseCountBadge");
            const creditBadge = document.getElementById("creditCountBadge");

            // Update stats
            courseBadge.textContent = `${schedule.length} Enrolled Courses`;
            const totalCredits = schedule.reduce((sum, item) => sum + (item.CreditHours || 0), 0);
            creditBadge.textContent = `${totalCredits} Credit Hours`;

            if (schedule.length === 0) {
                container.innerHTML = `
                    <div style="background-color: #1f2937; border: 1px dashed #374151; border-radius: 8px; padding: 40px; text-align: center;">
                        <p style="color: #9ca3af; font-size: 16px; margin-bottom: 16px;">You haven't registered for any courses yet.</p>
                        <a href="Courses.html" style="background-color: #324725; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600;">
                            Browse Courses
                        </a>
                    </div>
                `;
                return;
            }

            // Group courses by day of the week
            const daysOrder = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
            const groupedByDay = {};

            daysOrder.forEach(day => {
                groupedByDay[day] = schedule.filter(course => course.Day === day);
            });

            container.innerHTML = "";

            daysOrder.forEach(day => {
                const dayCourses = groupedByDay[day];
                if (dayCourses.length === 0) return; // Skip days without lectures

                const daySection = document.createElement("div");

                daySection.innerHTML = `
                    <h3 style="margin: 0 0 12px 0; font-size: 16px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px;">
                        <span>📅 ${day}</span>
                    </h3>
                    
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">
                        ${dayCourses.map(course => `
                            <div style="background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between;">
                                <div>
                                    <!-- Course Code & Start Time -->
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                        <span style="font-weight: 700; color: #60a5fa; font-size: 14px;">${course.CourseCode}</span>
                                        <span style="background-color: #111827; border: 1px solid #374151; font-size: 12px; padding: 3px 8px; border-radius: 4px; color: #f9fafb;">
                                            ⏰ ${course.StartTime} -${course.EndTime}
                                        </span>
                                    </div>

                                    <!-- Course Name -->
                                    <h4 style="margin: 0 0 12px 0; font-size: 17px; color: #f9fafb;">${course.CourseName}</h4>
                                </div>

                                <!-- Lecture Location -->
                                <div style="border-top: 1px solid #374151; padding-top: 10px; margin-top: 6px; font-size: 13px; color: #9ca3af; display: flex; align-items: center; gap: 6px;">
                                    <span>📍</span>
                                    <span>${course.Location}</span>
                                </div>
                            </div>
                        `).join("")}
                    </div>
                `;

                container.appendChild(daySection);
            });
        }

        // Initialize on load
        renderSchedule();
    </script>
</body>
</html>
