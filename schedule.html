<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coursera CHI - Schedule</title>
</head>
<body style="background-color: #111827; margin: 0; color: white; font-family: sans-serif;">

    <header style="display: flex; justify-content: space-between; align-items: center; background-color: #324725; padding: 12px 24px;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <a href="Option.html" style="color: #9ca3af; text-decoration: none; font-size: 20px;">&larr; Back</a>
            <h1 style="margin: 0; font-size: 24px;">My Schedule</h1>
        </div>
        <a href="profile.html" title="View Profile">
            <img src="Images/Gemenai 2.jpg" alt="Profile Icon" width="50" style="border-radius: 50%; display: block; cursor: pointer;">
        </a>
    </header>

    <main style="max-width: 1000px; margin: 0 auto; padding: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #374151; padding-bottom: 16px;">
            <div>
                <h2 style="margin: 0 0 4px 0; font-size: 20px; color: #f9fafb;">Weekly Lecture Schedule</h2>
                <p style="margin: 0; font-size: 14px; color: #9ca3af;">Timetable for all enrolled courses</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <span id="courseCountBadge" style="background-color: #1f2937; border: 1px solid #374151; padding: 6px 12px; border-radius: 6px; font-size: 13px; color: #60a5fa;">0 Enrolled Courses</span>
                <span id="creditCountBadge" style="background-color: #1f2937; border: 1px solid #374151; padding: 6px 12px; border-radius: 6px; font-size: 13px; color: #a7f3d0;">0 Credit Hours</span>
            </div>
        </div>

        <div id="scheduleContainer" style="display: flex; flex-direction: column; gap: 24px;"></div>
    </main>

    <script>
        function getCurrentStudent() {
            const stored = localStorage.getItem("currentUser");
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    return user.Student_ID ? user : null;
                } catch (e) {
                    return null;
                }
            }
            return null;
        }

        async function loadEnrolledSchedule() {
            const student = getCurrentStudent();
            if (!student) {
                alert("Please log in as a student first!");
                window.location.href = "auth.html";
                return [];
            }

            try {
                const response = await fetch(`https://localhost:3000/api/students/${student.Student_ID}/courses`);
                const data = await response.json();
                return data.success ? data.courses : [];
            } catch (err) {
                console.error("Failed to fetch enrolled schedule", err);
                return [];
            }
        }

        async function renderSchedule() {
            const schedule = await loadEnrolledSchedule();
            const container = document.getElementById("scheduleContainer");

            document.getElementById("courseCountBadge").textContent = schedule.length + " Enrolled Courses";
            
            let totalCredits = 0;
            for (let i = 0; i < schedule.length; i++) {
                totalCredits += parseInt(schedule[i].Credit_Hours) || 0;
            }
            document.getElementById("creditCountBadge").textContent = totalCredits + " Credit Hours";

            if (schedule.length === 0) {
                container.innerHTML = 
                    '<div style="background-color: #1f2937; border: 1px dashed #374151; border-radius: 8px; padding: 40px; text-align: center;">' +
                        '<p style="color: #9ca3af; margin-bottom: 16px;">You haven\'t registered for any courses yet.</p>' +
                        '<a href="Courses.html" style="background-color: #324725; color: white; padding: 10px 18px; border-radius: 6px; text-decoration: none; font-weight: 600;">Browse Courses</a>' +
                    '</div>';
                return;
            }

            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"];
            container.innerHTML = "";

            for (let d = 0; d < days.length; d++) {
                const day = days[d];
                const dayCourses = schedule.filter(function(c) {
                    return (c.Day || "Sunday") === day;
                });

                if (dayCourses.length === 0) continue;

                let cardsHtml = "";
                for (let j = 0; j < dayCourses.length; j++) {
                    const c = dayCourses[j];
                    cardsHtml += 
                        '<div style="background-init: #1f2937; background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 18px;">' +
                            '<div style="display: flex; justify-content: space-between; margin-bottom: 8px;">' +
                                '<span style="font-weight: bold; color: #60a5fa;">' + c.Course_Code + '</span>' +
                                '<span style="font-size: 12px; color: #f9fafb; background: #111827; padding: 2px 6px; border-radius: 4px;">⏰ ' + (c.Start_Time || "09:00 AM") + ' - ' + (c.End_Time || "10:30 AM") + '</span>' +
                            '</div>' +
                            '<h4 style="margin: 0 0 12px 0; font-size: 16px; color: #f9fafb;">' + c.Course_Name + '</h4>' +
                            '<div style="font-size: 13px; color: #9ca3af; border-top: 1px solid #374151; padding-top: 8px;">' +
                                '📍 ' + (c.Location || "Lec 101") +
                            '</div>' +
                        '</div>';
                }

                const section = document.createElement("div");
                section.innerHTML = 
                    '<h3 style="margin: 0 0 12px 0; font-size: 15px; color: #9ca3af; text-transform: uppercase;">📅 ' + day + '</h3>' +
                    '<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;">' +
                        cardsHtml +
                    '</div>';

                container.appendChild(section);
            }
        }

        renderSchedule();
    </script>
</body>
</html>
