<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Coursera CHI - Courses</title>
</head>
<body style="background-color: #111827; margin: 0; color: white; font-family: sans-serif;">

    <!-- Top Navigation Bar / Header -->
    <header style="display: flex; justify-content: space-between; align-items: center; background-color: #324725; padding: 12px 24px;">
        <div style="display: flex; align-items: center; gap: 16px;">
            <a href="Option.html" style="color: #9ca3af; text-decoration: none; font-size: 20px;">&larr; Back</a>
            <h1 style="margin: 0; font-size: 24px;">Available Courses</h1>
        </div>
        <a href="profile.html" title="View Profile">
            <img src="Images/Gemenai 2.jpg" alt="Profile Icon" width="50" style="border-radius: 50%; display: block; cursor: pointer;">
        </a>
    </header>

    <!-- Main Content Container -->
    <main style="max-width: 1100px; margin: 0 auto; padding: 24px;">

        <!-- Search Bar -->
        <div style="margin-bottom: 24px;">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Search by course code or name..." 
                oninput="filterCourses()"
                style="width: 100%; box-sizing: border-box; background-color: #1f2937; border: 1px solid #374151; color: white; padding: 12px 16px; border-radius: 8px; font-size: 15px; outline: none;"
            >
        </div>

        <!-- Courses Grid -->
        <div id="coursesGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
            <!-- Cards are dynamically rendered by JavaScript -->
        </div>

    </main>

    <script>
        // Course data following the UML diagram attributes
        const courses = [
            {
                CourseCode: "CS201",
                CourseName: "Data Structures & Algorithms",
                CreditHours: 3,
                MaxCapacity: 50,
                currentEnrolled: 42,
                isRegistered: false
            },
            {
                CourseCode: "CS304",
                CourseName: "Database Systems",
                CreditHours: 4,
                MaxCapacity: 30,
                currentEnrolled: 30, // Full capacity example
                isRegistered: false
            },
            {
                CourseCode: "CS205",
                CourseName: "Computer Architecture",
                CreditHours: 3,
                MaxCapacity: 45,
                currentEnrolled: 20,
                isRegistered: false
            },
            {
                CourseCode: "MATH201",
                CourseName: "Linear Algebra",
                CreditHours: 3,
                MaxCapacity: 60,
                currentEnrolled: 28,
                isRegistered: false
            }
        ];

        // UML Operation: CheckAvailability()
        function CheckAvailability(course) {
            return course.currentEnrolled < course.MaxCapacity;
        }

        // UML Operation: UpdateSeats()
        function UpdateSeats(courseCode) {
            const course = courses.find(c => c.CourseCode === courseCode);
            if (!course) return;

            if (course.isRegistered) {
                // Drop course
                course.currentEnrolled -= 1;
                course.isRegistered = false;
            } else {
                // Enroll in course
                if (CheckAvailability(course)) {
                    course.currentEnrolled += 1;
                    course.isRegistered = true;
                } else {
                    alert("Course is at full capacity!");
                    return;
                }
            }

            renderCourses(document.getElementById("searchInput").value);
        }

        // Render cards
        function renderCourses(searchTerm = "") {
            const container = document.getElementById("coursesGrid");
            container.innerHTML = "";

            const filtered = courses.filter(course => 
                course.CourseName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                course.CourseCode.toLowerCase().includes(searchTerm.toLowerCase())
            );

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: #9ca3af; grid-column: 1 / -1; text-align: center;">No courses found.</p>`;
                return;
            }

            filtered.forEach(course => {
                const isAvailable = CheckAvailability(course);
                const canEnroll = isAvailable || course.isRegistered;

                const card = document.createElement("div");
                card.style.cssText = "background-color: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between;";

                card.innerHTML = `
                    <div>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                            <span style="font-size: 14px; font-weight: 700; color: #60a5fa;">${course.CourseCode}</span>
                            <span style="background-color: #111827; border: 1px solid #374151; font-size: 12px; padding: 2px 8px; border-radius: 4px; color: #9ca3af;">
                                ${course.CreditHours} Credits
                            </span>
                        </div>
                        <h3 style="margin: 0 0 12px 0; font-size: 18px; color: #f9fafb;">${course.CourseName}</h3>
                        <div style="font-size: 13px; color: #9ca3af; margin-bottom: 16px;">
                            <span>Seats: </span>
                            <strong style="color: ${isAvailable ? '#f9fafb' : '#ef4444'};">
                                ${course.currentEnrolled} / ${course.MaxCapacity}
                            </strong>
                            ${!isAvailable && !course.isRegistered ? '<span style="color: #ef4444; margin-left: 6px;">(Full)</span>' : ''}
                        </div>
                    </div>

                    <button 
                        onclick="UpdateSeats('${course.CourseCode}')"
                        ${!canEnroll ? 'disabled' : ''}
                        style="
                            padding: 10px;
                            border-radius: 6px;
                            border: none;
                            cursor: ${canEnroll ? 'pointer' : 'not-allowed'};
                            font-weight: 600;
                            font-size: 14px;
                            color: white;
                            background-color: ${
                                course.isRegistered 
                                    ? '#ef4444' 
                                    : canEnroll 
                                        ? '#324725' 
                                        : '#4b5563'
                            };
                        "
                    >
                        ${course.isRegistered ? 'Drop Course' : canEnroll ? 'Register' : 'Course Full'}
                    </button>
                `;

                container.appendChild(card);
            });
        }

        function filterCourses() {
            const term = document.getElementById("searchInput").value;
            renderCourses(term);
        }

        // Initial render
        renderCourses();
    </script>
</body>
</html>
